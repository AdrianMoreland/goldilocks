name: Dependency audit

on:
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Report-only: the backlog is large, so this never fails the job; findings go to the run summary.
  # Make it blocking later by dropping `|| true` once the backlog is cleared.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: pnpm audit (production dependencies)
        run: |
          {
            echo '### pnpm audit --prod'
            echo '```'
            pnpm audit --prod --audit-level high || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
