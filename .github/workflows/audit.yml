name: Dependency audit

on:
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Report-only: the backlog is large, so this is deliberately not a required check.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: pnpm audit (production dependencies)
        run: |
          {
            echo '### pnpm audit --prod'
            echo '```'
            pnpm audit --prod --audit-level high || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          pnpm audit --prod --audit-level high
