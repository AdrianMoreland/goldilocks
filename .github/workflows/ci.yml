name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One job on purpose: branch protection requires a single, stable check name ("ci").
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # `prisma generate` (API postinstall) reads prisma.config.ts, which expects this; it never connects.
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Docs-only changes (roadmap, plans, ADRs, README) skip the heavy steps below. The job still finishes
      # green, so the required `ci` check reports as usual. Files that a test or the web build reads
      # (docs/sops, docs/ENGINEERING.md, DESIGN.md) always get the full pipeline.
      - name: Detect docs-only change
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then BASE="$PR_BASE"; else BASE="$PUSH_BEFORE"; fi
          # Decides whether a change only touches documentation that no build or test reads.
          # Prints docs_only=true|false. Input: BASE (commit to compare with). Compares BASE..HEAD.
          set -euo pipefail
          base="${BASE:-}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          changed="$(git diff --name-only "$base" HEAD)"
          [ -z "$changed" ] && { echo "docs_only=false" >> "$GITHUB_OUTPUT"; exit 0; }
          docs_only=true
          while IFS= read -r f; do
            case "$f" in
              # Read by tests or by the web build, so they always get the full pipeline.
              docs/ENGINEERING.md|DESIGN.md) docs_only=false ;;
              docs/adr/*) ;;
              docs/*/*) docs_only=false ;;          # docs/sops and any other folder
              docs/*.md|README.md|GLOSSARY.md|PRODUCT.md) ;;
              *) docs_only=false ;;
            esac
          done <<< "$changed"
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v6
        if: steps.scope.outputs.docs_only != 'true'

      - uses: actions/setup-node@v7
        if: steps.scope.outputs.docs_only != 'true'
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        if: steps.scope.outputs.docs_only != 'true'

      # Consumers read packages/shared-types/dist, so it must be built before anything else.
      - name: Build shared-types
        if: steps.scope.outputs.docs_only != 'true'
        run: pnpm --filter @goldilocks/shared-types build

      - name: Type-check API
        if: steps.scope.outputs.docs_only != 'true'
        run: pnpm --filter api exec tsc --noEmit --pretty false --incremental false

      # Baseline is 0 problems; any finding fails the run. Never the `lint` script (it passes --fix).
      - name: ESLint (API)
        if: steps.scope.outputs.docs_only != 'true'
        working-directory: apps/api
        run: node node_modules/eslint/bin/eslint.js src --no-fix --no-cache --max-warnings 0

      - name: API tests
        if: steps.scope.outputs.docs_only != 'true'
        run: pnpm --filter api exec jest --ci

      - name: shared-types tests
        if: steps.scope.outputs.docs_only != 'true'
        run: pnpm --filter @goldilocks/shared-types test

      # Fails on errors only; the warnings (React hook rules, see apps/web/eslint.config.js) are the visible backlog.
      - name: ESLint (web)
        if: steps.scope.outputs.docs_only != 'true'
        run: pnpm --filter web lint

      - name: Web tests
        if: steps.scope.outputs.docs_only != 'true'
        run: pnpm --filter web test

      # Includes `tsc -b`, so this is also the web type-check.
      - name: Build web
        if: steps.scope.outputs.docs_only != 'true'
        run: pnpm --filter web build

      - name: Type-check and build site
        if: steps.scope.outputs.docs_only != 'true'
        run: pnpm --filter site check-types && pnpm --filter site build

      - name: Site tests
        if: steps.scope.outputs.docs_only != 'true'
        run: pnpm --filter site test
