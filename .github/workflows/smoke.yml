name: Smoke test

# After CI finishes on a push to master, wait for Railway to deploy, then call the API's /health and the web
# root. Report only: a failure opens (or comments on) one `deploy-failed` issue and never blocks anything.
#
# Why this is its own workflow: Railway's "Wait for CI" waits for every workflow triggered by the push. A
# smoke test inside the push workflow waits for the deploy, so the deploy would wait for the smoke test.
# Triggered by the CI run instead, it starts only once the deploy is free to begin.
#
# Needs the repository variables API_URL and WEB_URL (Settings > Secrets and variables > Actions > Variables).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  smoke:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'master')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      API_URL: ${{ vars.API_URL }}
      WEB_URL: ${{ vars.WEB_URL }}
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2
      - name: Smoke test after deploy
        run: |
          set -uo pipefail
          if [ -z "$API_URL" ] || [ -z "$WEB_URL" ]; then
            echo "API_URL / WEB_URL repository variables are not set; smoke test skipped." >> "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          # Same paths as the Railway Watch Paths: anything else does not deploy. The first parent is the
          # branch before the merge, so this is everything the merge brought in. A manual run always tests.
          if [ "${{ github.event_name }}" = "workflow_run" ] && git cat-file -e "${SHA}^1" 2>/dev/null; then
            if ! git diff --name-only "${SHA}^1" "$SHA" | grep -qE '^(apps/|packages/|docs/ENGINEERING\.md$|DESIGN\.md$|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|turbo\.json$)'; then
              echo "No deploy-relevant change; smoke test skipped." >> "$GITHUB_STEP_SUMMARY"; exit 0
            fi
            sleep 240
          fi
          fail=""
          for i in $(seq 1 10); do
            api="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "${API_URL%/}/health" || true)"
            web="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "${WEB_URL%/}/" || true)"
            if [ "$api" = "200" ] && [ "$web" = "200" ]; then fail=""; break; fi
            fail="API /health: $api, web /: $web"
            sleep 30
          done
          if [ -z "$fail" ]; then
            echo "Smoke test passed: API /health 200, web / 200." >> "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          echo "Smoke test FAILED ($fail)" >> "$GITHUB_STEP_SUMMARY"
          gh label create deploy-failed --repo "$REPO" --color d93f0b --description "Post-deploy smoke test failed" >/dev/null 2>&1 || true
          open="$(gh issue list --repo "$REPO" --label deploy-failed --state open --json number --jq '.[0].number // empty')"
          msg="$(printf 'Smoke test failed after %s (%s).\n\nRun: %s/%s/actions/runs/%s' "${SHA:0:7}" "$fail" "$GITHUB_SERVER_URL" "$REPO" "$GITHUB_RUN_ID")"
          if [ -n "$open" ]; then gh issue comment "$open" --repo "$REPO" --body "$msg"
          else gh issue create --repo "$REPO" --label deploy-failed --title "Deploy smoke test failed" --body "$msg"; fi
          exit 0
